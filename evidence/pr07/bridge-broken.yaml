# DEFECT COPY for PR07 stage 2 - do not use in normal runs.
# Defects: (1) gz command topic typo cmd_vell, (2) IMU direction ROS_TO_GZ.
# ros_gz_bridge config (course copy). Changes vs. the baseline kit:
#   odometry ros_topic_name /vehicle/odom -> /vehicle/odom_gz (normalised by odom_adapter)
# QoS of the ROS side is set in bridge_qos.yaml (sensor data = best effort).
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /vehicle/gz_cmd_vel
  gz_topic_name: /model/course_ackermann/cmd_vell
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /vehicle/odom_gz
  gz_topic_name: /model/course_ackermann/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /vehicle/camera/image_raw
  gz_topic_name: /model/course_ackermann/camera
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /vehicle/camera/camera_info
  gz_topic_name: /model/course_ackermann/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

- ros_topic_name: /vehicle/scan
  gz_topic_name: /model/course_ackermann/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS

- ros_topic_name: /vehicle/imu
  gz_topic_name: /model/course_ackermann/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: ROS_TO_GZ

- ros_topic_name: /vehicle/joint_states
  gz_topic_name: /model/course_ackermann/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
